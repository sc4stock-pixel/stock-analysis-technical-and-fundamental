name: TimesFM Price Targets

# RETIRED 2026-08-10. TimesFM was scored out-of-sample for ~11 weeks and was dead at
# every horizon (5d 48%, 20d 47% — both significantly WORSE than a coin flip), and it
# effectively never made a high-conviction call (>5% bucket n=4). It is removed from all
# display surfaces and no longer worth a daily run.
#
# The schedule is disabled; workflow_dispatch is retained so the job can still be run
# by hand if the model is ever revisited. scripts/timesfm_predict.py and the historical
# timesfm_forecasts.json are kept deliberately — the probation record stays auditable.
on:
  workflow_dispatch:        # manual only — scheduled runs retired

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/google-research/timesfm.git
          pip install yfinance

      - name: Run predictor
        run: python scripts/timesfm_predict.py

      - name: Rebase on latest main (avoid concurrent-push races)
        run: git pull --rebase --autostash origin main || true

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update TimesFM price targets"
          file_pattern: "timesfm_forecasts.json"
