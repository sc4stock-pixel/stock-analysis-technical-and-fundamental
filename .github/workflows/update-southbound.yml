name: Update Southbound JSON

on:
  schedule:
    - cron: '30 02,04,08 * * *'      # 10:00 12:30 16:30 HKT
  workflow_dispatch:

permissions:
  contents: write              # <-- Required for scheduled pushes

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5 

      - name: Pull latest changes
        run: git pull --rebase origin main   # <-- Avoid non‑fast‑forward conflicts

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install akshare

      - name: Generate southbound data
        run: |
          cat << 'EOF' > /tmp/southbound.py
          import json, akshare as ak
          df = ak.stock_hsgt_fund_flow_summary_em()
          south = df[df['资金方向'] == '南向']
          total = 0.0
          for _, row in south.iterrows():
              val = row.get('成交净买额', 0)
              if isinstance(val, (int, float)):
                  total += val
          with open('southbound_data.json', 'w', encoding='utf-8') as f:
              json.dump({'todayYi': round(total, 2)}, f, ensure_ascii=False)
          print(f"Exported: totalYi = {round(total, 2)}")
          EOF
          python /tmp/southbound.py

      - name: Rebase on latest main (avoid concurrent-push races)
        run: |
          git pull --rebase --autostash origin main || {
            echo "::warning::rebase onto main did not complete; aborting to leave a clean tree"
            git rebase --abort || true
          }
          # `|| true` on its own masks the failure but not its wreckage: a rebase that
          # stops (conflicts, or a workflow_dispatch on a branch ahead of main) leaves
          # .git/rebase-merge behind, and every later git command dies with "already a
          # rebase-merge directory", exit 128. That is how a branch dispatch of
          # kronos.yml failed on 2026-08-15 *after* the predictor had succeeded.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::stale rebase state detected; clearing it"
            git rebase --abort || rm -rf .git/rebase-merge .git/rebase-apply
          fi

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update southbound data"
          file_pattern: 'southbound_data.json'
