name: Kronos Forecasts

on:
  schedule:
    # Was offset 30 min after the TimesFM job (0 22) to avoid push races; TimesFM was
    # retired 2026-08-10 and this is now the only forecast job. Time kept as-is so the
    # forecast bar date doesn't shift.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-${{ runner.os }}

      - name: Clone Kronos model code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git ./Kronos

      - name: Install dependencies
        run: |
          pip install "numpy<2"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # yfinance is PINNED. An unpinned resolve moved CI from 1.3.0 to 1.6.0,
          # whose HK bars carry NaN rows; Kronos rejects NaN, so 5 of 7 HK tickers
          # silently vanished from kronos_forecasts.json (2026-08-14). Bump this
          # deliberately and check the RECEIPT line in the log after doing so.
          pip install einops huggingface_hub safetensors tqdm pandas "yfinance==1.6.0"

      - name: Run predictor
        run: python scripts/kronos_predict.py

      # ⛔ BAR-DATE FRESHNESS GUARD — v2, region-aware (rewritten 2026-09-16).
      #
      # WHAT v1 GOT WRONG (added 2026-09-15, shipped in #76). v1 demanded that EVERY series
      # sit on the newest bar date in the file. That premise was false. The predictor runs at
      # ~00:38 UTC, about 4h38m after the US close, and yfinance still serves an all-NaN
      # placeholder for the newest US session. kronos_predict.py drops the NaN row, so the 9
      # US names (plus 3033.HK, whose bars carry NaN for a separate, long-standing coverage
      # reason) silently keep the PREVIOUS session. The result is a stable, expected shape:
      #
      #     normal weekday:   HK = session N,  US = session N-1
      #     weekend/holiday:  all 16 on the same date
      #
      # v1 therefore failed on most weekdays and would have stopped publishing altogether.
      # Measured against the last 20 revisions of kronos_forecasts.json on origin/main:
      # v1 FAILS 16 of them -- every file from a session where the US market had traded --
      # and v2 passes all 20. (Re-measure with the two scripts side by side if this is ever
      # doubted; the four v1 passes are 09-13, 09-14, 09-06, 09-07, i.e. the weekend files
      # plus US Labor Day.)
      # Mechanism confirmed from the run log (`gh run view 35040780382 --log`): exactly 10
      # symbols each logged "dropped 1 bar(s) with NaN OHLCV" -- the 9 US names + 3033.HK --
      # and not one HK name.
      #
      # WHAT v2 DOES. Keeps the protective intent (never publish a genuinely stale series)
      # while encoding the structure this pipeline can actually produce:
      #   1. the newest bar must be recent relative to this run  -> catches a wholly frozen file
      #   2. nothing may trail the newest bar by more than a long weekend + a holiday
      #
      # ⛔ A THIRD RULE WAS WRITTEN AND DELETED, TWICE. Both versions tried to assert that HK
      # must not lag the US, and both false-fired on legitimate files:
      #   - per-name ("every HK name must be current") fired on 2026-09-01, where 0939.HK had
      #     legitimately dropped a NaN bar;
      #   - one-step tolerance fired on an HK public holiday, because 3033.HK sits an extra
      #     step back on those days, so saving it needed a hardcoded 3033.HK exception.
      # Rules 1 and 2 need no exceptions and catch the real failure modes: a frozen file
      # within 4 days, and any single series frozen for 6+ days. Do not re-add a region rule
      # without a file that proves it silent on 2026-09-01 AND on a HK holiday.
      #
      # ⛔ DO NOT "fix" the US lag by moving the cron later. The 08:50 HKT debrief reads this
      # file at ~00:50 UTC, so any run late enough for a settled US bar would be read a full
      # session late by BOTH regions -- US no fresher, HK worse. The US lag is structural
      # given the debrief's position, not a scheduling defect.
      #
      # ⛔ DO NOT add a KV lookup. KV is itself a session behind at this hour: the job lands
      # 00:06-00:45 UTC and the autopilot worker does not write KV until ~00:55 UTC, so the
      # comparison would pass on exactly the day it was written for. An earlier draft also
      # read secrets.KV_REST_API_URL, which does not exist in this repo.
      #
      # Placement is BEFORE the commit step on purpose. A stale bar is a WRONG number, not a
      # missing one, and no consumer can detect staleness -- the 08:50 HKT debrief reads this
      # file and would report it as current. This trades a red run that publishes nothing for
      # a green run that publishes something misleading.
      - name: Verify forecast bar-date freshness
        run: |
          python - <<'EOF'
          import collections, datetime as dt, json, sys

          MAX_TRAIL_DAYS = 5   # a long weekend plus a holiday
          MAX_AGE_DAYS = 4     # newest bar vs this run

          fc = json.load(open("kronos_forecasts.json"))
          series = {k: v for k, v in fc.items() if k != "_metadata"}
          if not series:
              print("::error::kronos_forecasts.json carries no series")
              sys.exit(1)

          counts = collections.Counter(v.get("last_date") for v in series.values())
          known = [d for d in counts if d]
          if not known:
              print("::error::no series carries a last_date")
              sys.exit(1)

          newest = max(known)
          newest_d = dt.date.fromisoformat(newest)

          gen = (fc.get("_metadata") or {}).get("generated_at_utc", "")
          run_date = dt.date.fromisoformat(gen[:10]) if len(gen) >= 10 else dt.date.today()

          on_newest = sum(1 for v in series.values() if v.get("last_date") == newest)
          print(f"RECEIPT(freshness): newest bar {newest}; run date {run_date.isoformat()}; "
                f"{on_newest}/{len(series)} series on it")
          for d in sorted(counts, key=str):
              names = sorted(k for k, v in series.items() if v.get("last_date") == d)
              print(f"  {d}: {counts[d]}  ({', '.join(names)})")

          problems = []

          # 1. a wholly frozen file
          if (run_date - newest_d).days > MAX_AGE_DAYS:
              problems.append(
                  f"newest bar {newest} is {(run_date - newest_d).days} days before the "
                  f"run date {run_date.isoformat()}")

          # 2. nothing may trail the newest bar by more than a long weekend + holiday
          for k, v in sorted(series.items()):
              d = v.get("last_date")
              if d and (newest_d - dt.date.fromisoformat(d)).days > MAX_TRAIL_DAYS:
                  problems.append(
                      f"{k} is on {d}, "
                      f"{(newest_d - dt.date.fromisoformat(d)).days} days behind {newest}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("OK: bar dates are within the expected structure")
          EOF

      - name: Rebase on latest main (avoid concurrent-push races)
        run: |
          git pull --rebase --autostash origin main || {
            echo "::warning::rebase onto main did not complete; aborting to leave a clean tree"
            git rebase --abort || true
          }
          # `|| true` on its own masks the failure but not its wreckage: a rebase that
          # stops (conflicts, or a workflow_dispatch on a branch ahead of main) leaves
          # .git/rebase-merge behind, and every later git command dies with "already a
          # rebase-merge directory", exit 128. That is how a branch dispatch of
          # kronos.yml failed on 2026-08-15 *after* the predictor had succeeded.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::stale rebase state detected; clearing it"
            git rebase --abort || rm -rf .git/rebase-merge .git/rebase-apply
          fi

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update Kronos forecasts"
          file_pattern: "kronos_forecasts.json"

      - name: Update forecast_skill.json
        run: |
          # The audit walks the full git history of kronos_forecasts.json. Despite
          # fetch-depth:0 at checkout, the runner has been seeing a truncated history
          # (history_days=2). Force a full history before running so the skill numbers
          # reflect every snapshot, not a shallow tail.
          git fetch origin main --unshallow 2>/dev/null || git fetch origin main --depth=100000 2>/dev/null || true
          python3 scripts/forecast_probation_audit.py --emit-skill-json forecast_skill.json
          if ! git diff --quiet forecast_skill.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forecast_skill.json
            git commit -m "Update forecast_skill from probation audit"
            git pull --rebase origin main
            git push
          fi

      # Coverage gate -- LAST step on purpose: every artefact (forecasts + skill json)
      # ships first, then the run goes red if a ticker silently dropped out. Placing
      # this earlier would make a short-coverage day also skip the skill update.
      - name: Verify forecast coverage
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("kronos_forecasts.json"))["_metadata"]
          miss = m.get("missing", [])
          exp  = m.get("expected_count", "?")
          print(f"RECEIPT: {exp} in -> {m['stock_count']} forecast"
                + (f" -- MISSING {len(miss)}: {', '.join(miss)}" if miss else " -- OK"))
          sys.exit(1 if miss else 0)
          EOF
