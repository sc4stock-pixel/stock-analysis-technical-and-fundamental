name: Kronos Forecasts

on:
  schedule:
    # Was offset 30 min after the TimesFM job (0 22) to avoid push races; TimesFM was
    # retired 2026-08-10 and this is now the only forecast job. Time kept as-is so the
    # forecast bar date doesn't shift.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-hf-${{ runner.os }}

      - name: Clone Kronos model code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git ./Kronos

      - name: Install dependencies
        run: |
          pip install "numpy<2"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # yfinance is PINNED. An unpinned resolve moved CI from 1.3.0 to 1.6.0,
          # whose HK bars carry NaN rows; Kronos rejects NaN, so 5 of 7 HK tickers
          # silently vanished from kronos_forecasts.json (2026-08-14). Bump this
          # deliberately and check the RECEIPT line in the log after doing so.
          pip install einops huggingface_hub safetensors tqdm pandas "yfinance==1.6.0"

      - name: Run predictor
        run: python scripts/kronos_predict.py

      # ⛔ BAR-DATE FRESHNESS GUARD (added 2026-09-15).
      # The coverage gate below counts TICKERS via _metadata.missing; it cannot see a BAR
      # DATE. yfinance serves an all-NaN placeholder for a session that has not settled,
      # kronos_predict.py drops the NaN row, and that ticker silently keeps its PREVIOUS
      # bar. Live on 2026-09-15 the file shipped 6 series on 2026-09-14 and 10 on 2026-09-11
      # (all 9 US names + 3033.HK) and the run still reported success.
      #
      # The check is WITHIN-FILE on purpose: every series' bar date must equal the newest
      # bar date in the file. That needs no external reference, so it cannot false-fire on a
      # uniform lag (weekend, holiday, whole-market outage) and cannot be defeated by a
      # reference that is itself stale. An earlier draft compared against KV
      # regionLastRun -- that is WRONG at this job's run hour: the job lands 00:06-00:45 UTC
      # and the autopilot worker does not write KV until ~00:55 UTC, so KV is still one
      # session behind and the comparison would have passed on exactly the day it was
      # written for. The same draft also read secrets.KV_REST_API_URL, which does not exist
      # in this repo, so it would have gone red every day on an empty URL.
      #
      # ⛔ NOT covered: a file where ALL 16 series are stale. A uniform lag cannot be told
      # apart from a closed market without a session calendar, and the benign case (weekend)
      # is far more common than the harmful one. Do not "fix" that by adding a KV lookup.
      #
      # Placement is BEFORE the commit step on purpose. A stale bar is a WRONG number, not a
      # missing one, and no consumer can detect staleness -- the 08:50 HKT debrief reads this
      # file and would report it as current. This trades a red run that publishes nothing for
      # a green run that publishes something misleading.
      - name: Verify forecast bar-date freshness
        run: |
          python - <<'EOF'
          import collections, json, sys

          fc = json.load(open("kronos_forecasts.json"))
          series = {k: v for k, v in fc.items() if k != "_metadata"}
          if not series:
              print("::error::kronos_forecasts.json carries no series")
              sys.exit(1)

          counts = collections.Counter(v.get("last_date") for v in series.values())
          known = [d for d in counts if d]
          if not known:
              print("::error::no series carries a last_date")
              sys.exit(1)

          newest = max(known)
          stale = sorted(k for k, v in series.items() if v.get("last_date") != newest)

          print(f"RECEIPT(freshness): newest bar {newest}; "
                f"{len(series) - len(stale)}/{len(series)} series on it")
          for d in sorted(counts, key=str):
              print(f"  {d}: {counts[d]}")

          if stale:
              detail = ", ".join(f"{k}={series[k].get('last_date')}" for k in stale)
              print(f"::error::{len(stale)} series on an older bar than {newest}: {detail}")
              sys.exit(1)
          EOF

      - name: Rebase on latest main (avoid concurrent-push races)
        run: |
          git pull --rebase --autostash origin main || {
            echo "::warning::rebase onto main did not complete; aborting to leave a clean tree"
            git rebase --abort || true
          }
          # `|| true` on its own masks the failure but not its wreckage: a rebase that
          # stops (conflicts, or a workflow_dispatch on a branch ahead of main) leaves
          # .git/rebase-merge behind, and every later git command dies with "already a
          # rebase-merge directory", exit 128. That is how a branch dispatch of
          # kronos.yml failed on 2026-08-15 *after* the predictor had succeeded.
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            echo "::warning::stale rebase state detected; clearing it"
            git rebase --abort || rm -rf .git/rebase-merge .git/rebase-apply
          fi

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update Kronos forecasts"
          file_pattern: "kronos_forecasts.json"

      - name: Update forecast_skill.json
        run: |
          # The audit walks the full git history of kronos_forecasts.json. Despite
          # fetch-depth:0 at checkout, the runner has been seeing a truncated history
          # (history_days=2). Force a full history before running so the skill numbers
          # reflect every snapshot, not a shallow tail.
          git fetch origin main --unshallow 2>/dev/null || git fetch origin main --depth=100000 2>/dev/null || true
          python3 scripts/forecast_probation_audit.py --emit-skill-json forecast_skill.json
          if ! git diff --quiet forecast_skill.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forecast_skill.json
            git commit -m "Update forecast_skill from probation audit"
            git pull --rebase origin main
            git push
          fi

      # Coverage gate -- LAST step on purpose: every artefact (forecasts + skill json)
      # ships first, then the run goes red if a ticker silently dropped out. Placing
      # this earlier would make a short-coverage day also skip the skill update.
      - name: Verify forecast coverage
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("kronos_forecasts.json"))["_metadata"]
          miss = m.get("missing", [])
          exp  = m.get("expected_count", "?")
          print(f"RECEIPT: {exp} in -> {m['stock_count']} forecast"
                + (f" -- MISSING {len(miss)}: {', '.join(miss)}" if miss else " -- OK"))
          sys.exit(1 if miss else 0)
          EOF
